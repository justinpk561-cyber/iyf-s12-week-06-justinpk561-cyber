
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
</head>
<body>

    <h1>User Directory</h1>

    <div id="app">
        <p id="loading">Loading users...</p>

        <p id="error" class="hidden"></p>

        <div id="users-container"></div>
    </div>
    
<hr>

<h2>Create a New Post</h2>

<form id="post-form">
    <label for="post-title">Post Title:</label>
    <input type="text" id="post-title" required>

    <br><br>

    <label for="post-body">Post Content:</label>
    <textarea id="post-body" required></textarea>

    <br><br>

    <button type="submit">Create Post</button>
</form>

<div id="post-result"></div>
    
<hr>

<h2>Search and Filter Users</h2>

<input
    type="text"
    id="search-input"
    placeholder="Search by name or email"
>

<br><br>

<label for="sort-select">Sort by name:</label>
<select id="sort-select">
    <option value="asc">A - Z</option>
    <option value="desc">Z - A</option>
</select>

<br><br>

<label for="city-filter">Filter by city:</label>
<select id="city-filter">
    <option value="all">All Cities</option>
</select>
    

    <script src="user-directory.js"></script>
</body>
</html>
